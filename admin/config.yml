backend:
  name: git-gateway
  branch: main

media_folder: blog/images
public_folder: /blog/images

collections:
  - name: blog
    label: Blog posts
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Summary, name: description, widget: string }
      - { label: Article, name: body, widget: markdown }
