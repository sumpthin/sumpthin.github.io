name: Build and deploy site

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish generated blog files to the Pages source
        run: node scripts/publish-blog-files.mjs

      - name: Commit generated blog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts.json blog/posts
          if ! git diff --cached --quiet; then
            git commit -m "Update generated blog pages"
            git push
          fi
