<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - Shyam Sundar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --green: #2f7d5a; --ink: #14251d; --muted: #607168; --line: rgba(47, 125, 90, .16); }
  body { min-height: 100vh; background: #fff; color: var(--ink); font-family: 'Inter', sans-serif; font-weight: 300; line-height: 1.8; }
  nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.25rem 4rem; border-bottom: 1px solid var(--line); }
  nav a { text-decoration: none; }
  .nav-logo { color: var(--ink); font-family: 'DM Serif Display', serif; font-size: 1.1rem; }
  .back-link { color: var(--green); font-size: .78rem; font-weight: 500; }
  main { max-width: 760px; margin: 0 auto; padding: 5rem 1.5rem; }
  .date { color: var(--green); font-size: .72rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
  h1, h2 { font-family: 'DM Serif Display', serif; font-weight: 400; }
  h1 { margin: .75rem 0 2.5rem; font-size: clamp(2.6rem, 7vw, 4.5rem); line-height: 1.08; }
  .article-body { color: #35463d; font-size: 1rem; }
  .article-body p { margin: 1.4rem 0; }
  .article-body h2 { margin: 2.5rem 0 .75rem; color: var(--ink); font-size: 1.8rem; }
  figure { margin: 2rem 0; }
  figure img { display: block; width: 100%; height: auto; border-radius: .25rem; }
  figcaption { margin-top: .65rem; color: var(--muted); font-size: .78rem; }
  footer { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .75rem; }
  @media (max-width: 600px) { nav { padding: 1rem 1.25rem; } main { padding-top: 3.5rem; } }
</style>
</head>
<body>
<nav aria-label="Post navigation">
  <a href="../../" class="nav-logo">Shyam Sundar</a>
  <a href="../index.html" class="back-link">← All posts</a>
</nav>
<main>
  <article>
    <p class="date">{{DATE}}</p>
    <h1>{{TITLE}}</h1>
    <div class="article-body">{{BODY}}</div>
  </article>
</main>
<footer>Shyam Sundar D.</footer>
</body>
</html>
