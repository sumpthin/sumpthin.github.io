name: Build and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      title:
        description: Post title
        required: true
        type: string
      date:
        description: Publish date (YYYY-MM-DD)
        required: true
        type: string
      summary:
        description: Short summary shown on the blog page
        required: true
        type: string
      body:
        description: Article text in Markdown
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Create blog post
        if: github.event_name == 'workflow_dispatch'
        id: post
        run: node scripts/create-blog-post.mjs
        env:
          BLOG_TITLE: ${{ inputs.title }}
          BLOG_DATE: ${{ inputs.date }}
          BLOG_SUMMARY: ${{ inputs.summary }}
          BLOG_BODY: ${{ inputs.body }}

      - name: Convert plain-text blog files to posts
        run: node scripts/normalize-blog-posts.mjs

      - name: Build site
        run: npm run build

      - name: Publish generated blog files to the Pages source
        run: node scripts/publish-blog-files.mjs

      - name: Commit generated blog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content/blog
          git add blog/posts.json blog/posts
          if ! git diff --cached --quiet; then
            git commit -m "Update generated blog pages"
            git push
          fi
